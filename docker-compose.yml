services:
  postgres:
    image: postgres:16
    container_name: shopsphere-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    # ports:
    #   - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${AUTH_IMAGE}
    container_name: shopsphere_auth
    ports:
      - "8001:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: shopsphere_auth
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      USER_SERVICE_URL: http://user-service:8000
      USER_SERVICE_AUTH_TOKEN: ${USER_SERVICE_AUTH_TOKEN}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE}
      REFRESH_TOKEN_COOKIE_HTTPONLY: ${REFRESH_TOKEN_COOKIE_HTTPONLY}
      REFRESH_TOKEN_COOKIE_SAMESITE: ${REFRESH_TOKEN_COOKIE_SAMESITE}

    depends_on:
      postgres:
        condition: service_healthy 

  user-service:
    image: ${USER_IMAGE}
    container_name: shopsphere-user
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_user
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      SERVICE_AUTH_TOKEN: ${USER_SERVICE_AUTH_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    image: ${PRODUCT_IMAGE}
    container_name: shopsphere-product
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_product
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    image: ${INVENTORY_IMAGE}
    container_name: shopsphere-inventory
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_inventory
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_AUTH_TOKEN: ${INVENTORY_SERVICE_AUTH_TOKEN}

    depends_on:
      postgres:
        condition: service_healthy

  cart-service:
    image: ${CART_IMAGE}
    container_name: shopsphere-cart
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_cart
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      PRODUCT_SERVICE_URL: http://product-service:8000
      CART_SERVICE_AUTH_TOKEN: ${CART_SERVICE_AUTH_TOKEN}

    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: ${ORDER_IMAGE}
    container_name: shopsphere-order
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_order
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      CART_SERVICE_URL: http://cart-service:8000
      INVENTORY_SERVICE_AUTH_TOKEN: ${INVENTORY_SERVICE_AUTH_TOKEN}
      PAYMENT_SERVICE_AUTH_TOKEN: ${PAYMENT_SERVICE_AUTH_TOKEN}
      CART_SERVICE_AUTH_TOKEN: ${CART_SERVICE_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      AWS_REGION: ${AWS_REGION}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  payment-service:
    image: ${PAYMENT_IMAGE}
    container_name: shopsphere-payment
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_payment
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_AUTH_TOKEN: ${PAYMENT_SERVICE_AUTH_TOKEN}

    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:stable
    container_name: shopsphere-localstack
    restart: unless-stopped

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}

      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path

  order-publisher:
    image: ${ORDER_IMAGE}
    container_name: shopsphere-order-publisher
    restart: unless-stopped
    command: ["python", "-m", "app.outbox_publisher"]

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_order
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      CART_SERVICE_URL: http://cart-service:8000
      INVENTORY_SERVICE_AUTH_TOKEN: ${INVENTORY_SERVICE_AUTH_TOKEN}
      PAYMENT_SERVICE_AUTH_TOKEN: ${PAYMENT_SERVICE_AUTH_TOKEN}
      CART_SERVICE_AUTH_TOKEN: ${CART_SERVICE_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      AWS_REGION: ${AWS_REGION}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  order-consumer:
    image: ${ORDER_IMAGE}
    container_name: shopsphere-order-consumer
    restart: unless-stopped
    command: ["python", "-m", "app.sqs_consumer"]

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shopsphere_order
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      CART_SERVICE_URL: http://cart-service:8000
      INVENTORY_SERVICE_AUTH_TOKEN: ${INVENTORY_SERVICE_AUTH_TOKEN}
      PAYMENT_SERVICE_AUTH_TOKEN: ${PAYMENT_SERVICE_AUTH_TOKEN}
      CART_SERVICE_AUTH_TOKEN: ${CART_SERVICE_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      AWS_REGION: ${AWS_REGION}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}

    depends_on:
      localstack:
        condition: service_started

volumes:
  postgres_data: